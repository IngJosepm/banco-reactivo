server:
  port: 8090

spring:
  application:
    name: ledger-core
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5440/eventstore}
    username: ${SPRING_R2DBC_USERNAME:postgres}
    password: ${SPRING_R2DBC_PASSWORD:postgres}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: ledger-${server.port}
      auto-offset-reset: latest
  sql:
    init:
      mode: always

logging:
  level:
    com.ledger: DEBUG